[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "freecad-mcp"
version = "1.2.0"
description = "MCP server to control FreeCAD from Claude Desktop"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.27.0",
]

[project.urls]
Homepage   = "https://github.com/Perro-Megabass/freecad-mcp"
Instagram  = "https://www.instagram.com/perromods/"

[project.scripts]
freecad-mcp = "freecad_mcp.__main__:main"
